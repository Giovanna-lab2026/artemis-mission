<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Missão Artemis</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #0b0c2a;
            color: white;
        }

        h1 {
            margin-top: 20px;
        }

        .logo {
            width: 220px;
            margin: 20px 0;
        }

        .texto {
            max-width: 700px;
            margin: auto;
            font-size: 18px;
        }

        .galeria {
            margin-top: 30px;
        }

        .galeria img {
            width: 250px;
            margin: 10px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>Missão Artemis</h1>

    <!-- LOGO -->
    <img class="logo" src="https://www.nasa.gov/wp-content/uploads/2023/03/artemis-logo.png" alt="Logo Artemis">

    <!-- TEXTO -->
    <div class="texto">
        <p>
            A missão Artemis é um programa da NASA que tem como objetivo
            levar novamente seres humanos à Lua. O projeto pretende pousar
            a primeira mulher e a próxima pessoa na superfície lunar,
            além de preparar futuras missões para Marte.
        </p>
    </div>

    <!-- GALERIA -->
    <div class="galeria">
        <img src="https://www.nasa.gov/wp-content/uploads/2023/03/artemis1.jpg">
        <img src="https://www.nasa.gov/wp-content/uploads/2023/03/orion.jpg">
        <img src="https://www.nasa.gov/wp-content/uploads/2023/03/moon.jpg">
        <img src="https://www.nasa.gov/wp-content/uploads/2023/03/rocket.jpg">
        <img src="https://www.nasa.gov/wp-content/uploads/2023/03/launch.jpg">
    </div>

</body>
</html>
