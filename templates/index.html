<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Missão Artemis</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background:#020b3d;
      color:white;
      text-align:center;
    }

    header{
      padding:40px 20px;
    }

    h1{
      font-size:55px;
      margin-bottom:20px;
    }

    p{
      max-width:700px;
      margin:auto;
      line-height:1.6;
      font-size:20px;
    }

    .imagens{
      display:flex;
      justify-content:center;
      gap:30px;
      flex-wrap:wrap;
      margin:60px 20px;
    }

    .imagens img{
      width:320px;
      height:220px;
      object-fit:cover;
      border-radius:15px;
      transition:0.3s;
      box-shadow:0 0 15px rgba(0,0,0,0.4);
    }

    .imagens img:hover{
      transform:scale(1.05);
    }

    footer{
      background:#01072c;
      padding:25px;
      margin-top:40px;
      font-size:20px;
    }

  </style>
</head>

<body>

  <header>

    <h1>Missão Artemis</h1>

    <p>
      A Missão Artemis é um programa espacial da NASA que busca levar
      humanos novamente à Lua e preparar futuras missões para Marte.
    </p>

  </header>

  <section class="imagens">

    <img 
      src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQcNG442IXTU5lRX81fUw_v1Fo8G91Fy1nk0Q&s"
      alt="Espaço">

    <img 
      src="https://admin.cnnbrasil.com.br/wp-content/uploads/sites/12/2024/07/ariane-6.jpg?w=1024-0"
      alt="Foguete">

  </section>

  <footer>
    <p>© 2026 - Missão Artemis</p>
  </footer>

</body>
</html>
