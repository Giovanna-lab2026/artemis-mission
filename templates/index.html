<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Missão Artemis</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body{
      background:#020b3d;
      color:white;
      text-align:center;
    }

    header{
      padding:40px 20px;
    }

    h1{
      font-size:48px;
      margin-bottom:20px;
    }

    p{
      max-width:700px;
      margin:auto;
      line-height:1.6;
      font-size:18px;
    }

    .imagens{
      display:flex;
      justify-content:center;
      gap:30px;
      flex-wrap:wrap;
      margin:50px 20px;
    }

    .imagens img{
      width:300px;
      height:200px;
      object-fit:cover;
      border-radius:12px;
      transition:0.3s;
    }

    .imagens img:hover{
      transform:scale(1.05);
    }

    footer{
      background:#01072c;
      padding:20px;
      margin-top:40px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Missão Artemis</h1>

    <p>
      A Missão Artemis é um programa espacial da NASA que busca
      levar humanos novamente à Lua e preparar futuras missões para Marte.
    </p>
  </header>

  <section class="imagens">

    <img src="https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?q=80&w=1200&auto=format&fit=crop" alt="Espaço">

    <img src="https://images.unsplash.com/photo-1516849841032-87cbac4d88f7?q=80&w=1200&auto=format&fit=crop" alt="Foguete">

  </section>

  <footer>
    <p>© 2026 - Missão Artemis</p>
  </footer>

</body>
</html>
